spring:
  # 로컬 개발용 H2 인메모리 DB (별도 설치 없이 즉시 실행 가능)
  datasource:
    url: jdbc:h2:mem:infogames;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
