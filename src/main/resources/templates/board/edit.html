<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('글 수정')}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container" th:with="type=${boardType.name().toLowerCase()}">
    <div class="card">
        <h2>글 수정</h2>
        <div class="msg" id="msg" style="display:none;"></div>
        <form id="form" th:data-type="${type}" th:data-id="${post.id}" th:data-board="${boardType.name()}">
            <label>제목</label>
            <input type="text" name="title" th:value="${post.title}" required>

            <div th:if="${boardType.name() == 'REVIEW'}">
                <label>평점 (0-5)</label>
                <input type="number" name="rating" min="0" max="5" th:value="${post.rating}">
            </div>

            <label>내용</label>
            <textarea name="content" required th:text="${post.content}"></textarea>

            <div style="margin-top:16px;">
                <button type="submit">수정</button>
                <a class="btn btn-secondary" th:href="@{'/board/' + ${type} + '/view/' + ${post.id}}">취소</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script>
$("#form").submit(function (e) {
    e.preventDefault();
    var $f = $(this), type = $f.data("type"), id = $f.data("id"), board = $f.data("board");
    var data = { title: this.title.value, content: this.content.value };
    if (board === "REVIEW") data.rating = parseInt(this.rating.value, 10);
    $.ajax({ url: "/api/board/" + id, type: "PUT",
        contentType: "application/json", data: JSON.stringify(data) })
    .done(function () { location.href = "/board/" + type + "/view/" + id; })
    .fail(function (xhr) { showMsg("#msg", errText(xhr), false); });
});
</script>
</body>
</html>
