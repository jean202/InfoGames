<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('글 수정')}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container" th:with="type=${boardType.name().toLowerCase()}">
    <div class="card">
        <h2>글 수정</h2>
        <div class="msg" id="msg" style="display:none;"></div>
        <form id="form" th:data-type="${type}" th:data-id="${post.id}" th:data-board="${boardType.name()}">
            <label>제목</label>
            <input type="text" name="title" th:value="${post.title}" required>

            <div th:if="${boardType.name() == 'REVIEW'}">
                <label>평점 (0-5)</label>
                <input type="number" name="rating" min="0" max="5" th:value="${post.rating}">
            </div>

            <label>내용</label>
            <textarea name="content" id="content" th:text="${post.content}"></textarea>

            <label>기존 첨부파일</label>
            <ul id="existingFiles" style="list-style:none;padding:0;margin:0;">
                <li th:if="${files == null or files.isEmpty()}" class="muted">첨부파일 없음</li>
                <li th:each="f : ${files}" th:attr="data-fid=${f.id}" style="margin:4px 0;">
                    <a th:href="@{'/api/file/download/' + ${f.id}}" th:text="${f.originalName}"></a>
                    <button type="button" class="btn-danger btn-sm" th:attr="onclick='deleteFile(' + ${f.id} + ')'">삭제</button>
                </li>
            </ul>

            <label>첨부파일 추가 <span class="muted">(여러 개 선택 가능)</span></label>
            <input type="file" id="attachments" multiple>

            <div style="margin-top:16px;">
                <button type="submit">수정</button>
                <a class="btn btn-secondary" th:href="@{'/board/' + ${type} + '/view/' + ${post.id}}">취소</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script src="/ckeditor/ckeditor.js"></script>
<script th:inline="javascript">
var POST_ID = [[${post.id}]];
CKEDITOR.replace("content", {
    height: 320,
    filebrowserUploadUrl: "/api/file/image",
    filebrowserUploadMethod: "xhr"
});

function deleteFile(fileId) {
    if (!confirm("첨부파일을 삭제하시겠습니까?")) return;
    $.ajax({ url: "/api/file/" + fileId, type: "DELETE" })
        .done(function () { $("li[data-fid='" + fileId + "']").remove(); })
        .fail(function (xhr) { alert(errText(xhr)); });
}

function uploadAttachments(postId, done) {
    var files = $("#attachments")[0].files;
    if (!files.length) { done(); return; }
    var i = 0;
    (function next() {
        if (i >= files.length) { done(); return; }
        var fd = new FormData();
        fd.append("postId", postId);
        fd.append("file", files[i]);
        fd.append("order", i);
        $.ajax({ url: "/api/file/upload", type: "POST", data: fd, processData: false, contentType: false })
            .always(function () { i++; next(); });
    })();
}

$("#form").submit(function (e) {
    e.preventDefault();
    var $f = $(this), type = $f.data("type"), id = $f.data("id"), board = $f.data("board");
    var data = { title: this.title.value, content: CKEDITOR.instances.content.getData() };
    if (board === "REVIEW") data.rating = parseInt(this.rating.value, 10);
    $.ajax({ url: "/api/board/" + id, type: "PUT",
        contentType: "application/json", data: JSON.stringify(data) })
    .done(function () {
        uploadAttachments(id, function () { location.href = "/board/" + type + "/view/" + id; });
    })
    .fail(function (xhr) { showMsg("#msg", errText(xhr), false); });
});
</script>
</body>
</html>
