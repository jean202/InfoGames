<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('비밀번호 변경')}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
    <div class="card" style="max-width:420px;margin:0 auto;">
        <h2>비밀번호 변경</h2>
        <div class="msg" id="msg" style="display:none;"></div>
        <form id="form">
            <label>현재 비밀번호</label>
            <input type="password" name="currentPassword" required>
            <label>새 비밀번호</label>
            <input type="password" name="newPassword" required>
            <label>새 비밀번호 확인</label>
            <input type="password" name="newPasswordConfirm" required>
            <div style="margin-top:16px;">
                <button type="submit">변경</button>
                <a class="btn btn-secondary" th:href="@{/user/mypage}">취소</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script>
$("#form").submit(function (e) {
    e.preventDefault();
    if (this.newPassword.value !== this.newPasswordConfirm.value) {
        showMsg("#msg", "새 비밀번호가 일치하지 않습니다", false); return;
    }
    var data = { currentPassword: this.currentPassword.value, newPassword: this.newPassword.value };
    $.ajax({ url: "/api/user/change-password", type: "PUT",
        contentType: "application/json", data: JSON.stringify(data) })
    .done(function (r) {
        alert(r.message);
        location.href = "/user/mypage";
    }).fail(function (xhr) { showMsg("#msg", errText(xhr), false); });
});
</script>
</body>
</html>
