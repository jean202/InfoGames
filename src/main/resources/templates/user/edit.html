<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('회원정보 수정')}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
    <div class="card" style="max-width:480px;margin:0 auto;">
        <h2>회원정보 수정</h2>
        <div class="msg" id="msg" style="display:none;"></div>
        <form id="form">
            <label>아이디</label>
            <input type="text" th:value="${user.username}" disabled>
            <label>이름</label>
            <input type="text" name="name" th:value="${user.name}" required>
            <label>이메일</label>
            <input type="email" name="email" th:value="${user.email}" required>
            <label>닉네임</label>
            <input type="text" name="nickname" th:value="${user.nickname}" required>
            <div style="margin-top:16px;">
                <button type="submit">저장</button>
                <a class="btn btn-secondary" th:href="@{/user/mypage}">취소</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script>
$("#form").submit(function (e) {
    e.preventDefault();
    var data = { name: this.name.value, email: this.email.value, nickname: this.nickname.value };
    $.ajax({ url: "/api/user/update", type: "PUT",
        contentType: "application/json", data: JSON.stringify(data) })
    .done(function () {
        alert("수정되었습니다.");
        location.href = "/user/mypage";
    }).fail(function (xhr) { showMsg("#msg", errText(xhr), false); });
});
</script>
</body>
</html>
