<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('InfoGames')}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
    <div class="card">
        <h1>🎮 InfoGames</h1>
        <p class="muted">게임 정보 커뮤니티 (JSP/Servlet → Spring Boot 마이그레이션 데모)</p>
    </div>

    <div class="card">
        <h2>게시판</h2>
        <table>
            <thead><tr><th>게시판</th><th>글 수</th><th></th></tr></thead>
            <tbody>
            <tr>
                <td>자유게시판</td>
                <td th:text="${freeCount}">0</td>
                <td><a class="btn btn-sm" th:href="@{/board/free/list}">바로가기</a></td>
            </tr>
            <tr>
                <td>팁게시판</td>
                <td th:text="${tipCount}">0</td>
                <td><a class="btn btn-sm" th:href="@{/board/tip/list}">바로가기</a></td>
            </tr>
            <tr>
                <td>리뷰게시판</td>
                <td th:text="${reviewCount}">0</td>
                <td><a class="btn btn-sm" th:href="@{/board/review/list}">바로가기</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
