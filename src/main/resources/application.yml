spring:
  application:
    name: infogames
  # 기본 실행 프로파일(로컬 개발). 운영 배포 시 -Dspring.profiles.active=prod 로 전환
  profiles:
    active: dev

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

# 첨부파일 저장 경로 (FileService @Value)
file:
  upload:
    path: uploads

server:
  port: 8080

logging:
  level:
    com.infogames: debug
    org.hibernate.SQL: debug
